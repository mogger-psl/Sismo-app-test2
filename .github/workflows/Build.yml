name: Compilar APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Configurar ruta del Android SDK
        shell: bash
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar aplicación y ejecutar tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace test assembleDebug
          else
            echo "::error::No existe el Gradle Wrapper ./gradlew"
            exit 1
          fi

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: sismo-offline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
