name: Build Android ZIP

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      ANDROID_API: "32"
      BUILD_TOOLS_VERSION: "32.0.0"
      COMPAT_SDK: "35"
      COMPAT_BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDKs
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "build-tools;${COMPAT_BUILD_TOOLS}"

      - name: Extract project from ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "SismoOffline.zip" ]; then
            echo "No existe SismoOffline.zip en la raíz del repo."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q SismoOffline.zip -d extracted

          PROJECT_DIR=""
          while IFS= read -r found; do
            PROJECT_DIR="$(dirname "$found")"
            break
          done < <(find extracted -type f -name gradlew -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró un proyecto Android dentro del ZIP."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android encontrado en: $PROJECT_DIR"

      - name: Prepare Android project for SDK compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

          if [ -f local.properties ]; then
            rm -f local.properties
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          # Ajuste defensivo para proyectos antiguos que usan SDK 32 o similares
          while IFS= read -r file; do
            sed -i -E \
              -e 's/(compileSdkVersion[[:space:]]+)[0-9]+/compileSdkVersion 35/g' \
              -e 's/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/compileSdk = 35/g' \
              -e 's/(targetSdkVersion[[:space:]]+)[0-9]+/targetSdkVersion 35/g' \
              -e 's/(targetSdk[[:space:]]*=[[:space:]]*)[0-9]+/targetSdk = 35/g' \
              "$file"
          done < <(find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print)

          echo "Contenido relevante del proyecto:"
          find . -maxdepth 2 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sismo-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.aab
          if-no-files-found: error
