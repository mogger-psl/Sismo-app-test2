name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataformas Android
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-32" \
            "platforms;android-35" \
            "build-tools;32.0.0" \
            "build-tools;35.0.0"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -euxo pipefail

          test -f SismoOffline.zip

          rm -rf android-project
          mkdir -p android-project

          unzip -o SismoOffline.zip -d android-project

          echo "Contenido del ZIP:"
          find android-project -maxdepth 5 -type f | sort

      - name: Detectar proyecto Gradle
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR=""

          if find android-project -type f -name gradlew | grep -q .; then
            PROJECT_DIR="$(dirname "$(find android-project -type f -name gradlew | head -n 1)")"
          elif find android-project -type f -name build.gradle | grep -q .; then
            PROJECT_DIR="$(dirname "$(find android-project -type f -name build.gradle | head -n 1)")"
          elif find android-project -type f -name build.gradle.kts | grep -q .; then
            PROJECT_DIR="$(dirname "$(find android-project -type f -name build.gradle.kts | head -n 1)")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró un proyecto Android dentro del ZIP."
            echo "El ZIP debe contener build.gradle, build.gradle.kts o gradlew."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Preparar proyecto
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Instalar Gradle si el ZIP no incluye gradlew
        if: ${{ success() }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            GRADLE_VERSION="8.7"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            sudo unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

            echo "El ZIP no contiene gradlew; se usará Gradle ${GRADLE_VERSION}."
          fi

      - name: Compilar APK debug
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Buscar APK generado
        shell: bash
        run: |
          set -euxo pipefail

          echo "APKs encontrados:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          if ! find "$PROJECT_DIR" -type f -name "*.apk" | grep -q .; then
            echo "ERROR: La compilación terminó sin generar ningún APK."
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: sismo-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
