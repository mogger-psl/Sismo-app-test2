name: Compilar APK Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Instalar Gradle
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            "https://services.gradle.org/distributions/gradle-8.2.1-bin.zip" \
            --output /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Configurar ruta del Android SDK
        shell: bash
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > local.properties

      - name: Compilar aplicación y ejecutar tests
        shell: bash
        run: |
          gradle --no-daemon --stacktrace test assembleDebug

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: sismo-offline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
